<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Local Web Fix website preview</title>
  <desc id="desc">Preview of the Local Web Fix homepage layout, matching the live service website style.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .headerline { stroke: #0b0c0c; stroke-width: 2; }
      .rule { stroke: #b1b4b6; stroke-width: 1; }
      .brand { font: 700 20px Segoe UI, Arial, sans-serif; fill: #0b0c0c; }
      .nav { font: 600 15px Segoe UI, Arial, sans-serif; fill: #0b0c0c; }
      .kicker { font: 700 15px Segoe UI, Arial, sans-serif; fill: #4e5551; }
      .headline { font: 700 62px Segoe UI, Arial, sans-serif; fill: #0b0c0c; letter-spacing: -1px; }
      .body { font: 20px Segoe UI, Arial, sans-serif; fill: #4e5551; }
      .tickText { font: 600 16px Segoe UI, Arial, sans-serif; fill: #0b0c0c; }
      .primary { fill: #00593b; }
      .primaryEdge { fill: #002d1e; }
      .primaryText { font: 700 17px Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .secondary { fill: #ffffff; stroke: #0b0c0c; stroke-width: 2; }
      .secondaryText { font: 700 17px Segoe UI, Arial, sans-serif; fill: #0b0c0c; }
      .card { fill: #ffffff; stroke: #b1b4b6; stroke-width: 1; }
      .cardTop { fill: #0b0c0c; }
      .cardTitle { font: 700 20px Segoe UI, Arial, sans-serif; fill: #0b0c0c; }
      .cardText { font: 17px Segoe UI, Arial, sans-serif; fill: #4e5551; }
      .logoBox { fill: none; stroke: #00593b; stroke-width: 3; }
      .tick { stroke: #00593b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <rect class="page" width="1200" height="760"/>

  <!-- Header -->
  <rect class="logoBox" x="60" y="24" width="30" height="30"/>
  <path class="tick" d="M66 39l7 7 12 -13"/>
  <text class="brand" x="102" y="45">Local Web Fix</text>
  <text class="nav" x="640" y="45">What I fix</text>
  <text class="nav" x="742" y="45">Example</text>
  <text class="nav" x="830" y="45">Prices</text>
  <text class="nav" x="900" y="45">Process</text>
  <text class="nav" x="984" y="45">Access</text>
  <text class="nav" x="1062" y="45">Free check</text>
  <line class="headerline" x1="0" y1="78" x2="1200" y2="78"/>

  <!-- Hero copy -->
  <text class="kicker" x="60" y="150">Small online tidy-ups for UK local businesses</text>
  <text class="headline" x="56" y="230">Make the important</text>
  <text class="headline" x="56" y="300">stuff easier to find.</text>
  <text class="body" x="60" y="350">I check your website, Google listing or social pages for the basics</text>
  <text class="body" x="60" y="380">customers rely on: hours, menus, prices, phone buttons and layout.</text>

  <path class="tick" d="M62 412l6 6 10 -11"/>
  <text class="tickText" x="90" y="424">Free public check first</text>
  <path class="tick" d="M292 412l6 6 10 -11"/>
  <text class="tickText" x="320" y="424">No login needed</text>
  <path class="tick" d="M482 412l6 6 10 -11"/>
  <text class="tickText" x="510" y="424">No sales or ranking promises</text>

  <!-- Buttons -->
  <rect class="primaryEdge" x="60" y="458" width="190" height="55"/>
  <rect class="primary" x="60" y="455" width="190" height="52"/>
  <text class="primaryText" x="155" y="487" text-anchor="middle">Start free check</text>
  <rect class="secondary" x="270" y="455" width="150" height="52"/>
  <text class="secondaryText" x="345" y="487" text-anchor="middle">See prices</text>
  <text class="body" x="60" y="545">Run by Jamie Parr, a Computing Technologies student based in Belfast.</text>

  <!-- Hero card -->
  <rect class="cardTop" x="760" y="140" width="380" height="4"/>
  <rect class="card" x="760" y="144" width="380" height="330"/>
  <text class="cardTitle" x="790" y="192">Quick check looks at</text>
  <path class="tick" d="M792 216l6 6 10 -11"/>
  <text class="cardText" x="820" y="228">Menus and services</text>
  <path class="tick" d="M792 252l6 6 10 -11"/>
  <text class="cardText" x="820" y="264">Opening hours</text>
  <path class="tick" d="M792 288l6 6 10 -11"/>
  <text class="cardText" x="820" y="300">Call buttons</text>
  <path class="tick" d="M792 324l6 6 10 -11"/>
  <text class="cardText" x="820" y="336">Booking and order links</text>
  <path class="tick" d="M792 360l6 6 10 -11"/>
  <text class="cardText" x="820" y="372">Google details</text>
  <line class="rule" x1="790" y1="398" x2="1110" y2="398"/>
  <text class="cardText" x="790" y="430">Best fit: cafés, takeaways, salons,</text>
  <text class="cardText" x="790" y="456">trades, shops and local services.</text>

  <!-- Lower section -->
  <line class="rule" x1="0" y1="590" x2="1200" y2="590"/>
  <rect class="cardTop" x="60" y="620" width="340" height="4"/>
  <rect class="card" x="60" y="624" width="340" height="106"/>
  <text class="cardTitle" x="84" y="660">People can’t find the basics</text>
  <text class="cardText" x="84" y="690">Menus, hours or key details are</text>
  <text class="cardText" x="84" y="714">hidden, outdated or hard to read.</text>

  <rect class="cardTop" x="430" y="620" width="340" height="4"/>
  <rect class="card" x="430" y="624" width="340" height="106"/>
  <text class="cardTitle" x="454" y="660">They can’t take the next step</text>
  <text class="cardText" x="454" y="690">The call, book or order route is</text>
  <text class="cardText" x="454" y="714">unclear, broken or awkward.</text>

  <rect class="cardTop" x="800" y="620" width="340" height="4"/>
  <rect class="card" x="800" y="624" width="340" height="106"/>
  <text class="cardTitle" x="824" y="660">Details don’t match</text>
  <text class="cardText" x="824" y="690">Website, Google and socials tell</text>
  <text class="cardText" x="824" y="714">different stories to customers.</text>
</svg>
